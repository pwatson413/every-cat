<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Cat in the World</title>
<!--
  EVERY CAT IN THE WORLD: build notes for whoever edits this page next.

  One file holds the whole app: styles, species data, quiz logic and interface, in that order below.
  Photos are separate files of this artifact, listed in the JSON block with id="photo-manifest":

    { "cats":   { "<cat id>": [ { "f": "p/3fa9c1.jpg", "w": 1000, "h": 667,
                                   "by": "Photographer", "lic": "CC BY-SA 4",
                                   "src": "https://commons.wikimedia.org/wiki/File:...",
                                   "cb": 0, "note": "", "loc": "" } ] },
      "thumbs": { "<cat id>": "t/3fa9c1.jpg" } }

  - Cat ids are the "id" values in the CATS list in the data script (41 of them).
  - "f" is a path relative to this page. Give files names that do not reveal the species.
  - "cb": 1 marks a curveball (melanistic, white or king forms, unusual house-cat breeds); "note" says what it is.
  - "loc" is where the photo was taken; it is shown only for cats that have a "hint" in the data.
  - "thumbs" are 160px squares for the list of all cats.
  - With an empty manifest every question falls back to written field marks, and stations stop at "learning".
    As soon as a cat has photos, its questions use them. Nothing else in the page needs to change.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400;1,500&amp;family=National+Park:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: one column on phones with tabs at the bottom; from 900px the photo sits beside the
     answer panel and the tabs move up into the top bar. The eight lineage colours are the only loud
     thing on the page; everything else is paper and one deep spruce ink. */
  --paper: #eef1ec;
  --raised: #f9fbf7;
  --ink: #10291f;
  --ink-2: #48604f;
  --rule: #c6d0c5;
  --stage: #0b1b15;
  --stage-ink: #e9f0ea;
  --good: #0ca30c;
  --bad: #d03b3b;
  --warn: #fab219;
  /* lineage colours, in the order the lines branched off; validated for colour-blind separation */
  --l1: #876204; --l2: #0052b4; --l3: #b6322d; --l4: #0688a7;
  --l5: #d26600; --l6: #8b5dce; --l7: #047e39; --l8: #c85aac;
  --display: "National Park", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --fs-0: 0.8125rem; --fs-1: 0.9375rem; --fs-2: 1.0625rem; --fs-3: 1.3125rem; --fs-4: 1.75rem; --fs-5: 2.5rem;
  --gutter: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a16; --raised: #17261f; --ink: #e7efe8; --ink-2: #a2b4a7; --rule: #2b3e35;
    --stage: #060d0a; --stage-ink: #e9f0ea;
    --l1: #bc8a0f; --l2: #3370c7; --l3: #e16a60; --l4: #06a4c9;
    --l5: #b05400; --l6: #a37ce1; --l7: #40ad60; --l8: #a74990;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a16; --raised: #17261f; --ink: #e7efe8; --ink-2: #a2b4a7; --rule: #2b3e35;
  --stage: #060d0a; --stage-ink: #e9f0ea;
  --l1: #bc8a0f; --l2: #3370c7; --l3: #e16a60; --l4: #06a4c9;
  --l5: #b05400; --l6: #a37ce1; --l7: #40ad60; --l8: #a74990;
  color-scheme: dark;
}
.line-1 { --lc: var(--l1); } .line-2 { --lc: var(--l2); } .line-3 { --lc: var(--l3); } .line-4 { --lc: var(--l4); }
.line-5 { --lc: var(--l5); } .line-6 { --lc: var(--l6); } .line-7 { --lc: var(--l7); } .line-8 { --lc: var(--l8); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 var(--fs-2)/1.5 var(--text); -webkit-text-size-adjust: 100%; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- frame ---------- */
#app { height: 100%; display: flex; flex-direction: column; max-width: 1120px; margin: 0 auto; }
.bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px var(--gutter) 8px; }
.brand { font: 800 1.22rem/1 var(--display); letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; }
.known { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; padding: 6px 12px 6px 10px; border: 1.5px solid var(--rule); border-radius: 999px;
  font: 700 var(--fs-1)/1 var(--display); font-variant-numeric: tabular-nums; text-decoration: none; white-space: nowrap; }
.known:hover { border-color: var(--ink); }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; }
.meter i { width: 4px; height: 100%; border-radius: 2px; background: linear-gradient(to top, var(--lc) calc(var(--f, 0) * 100%), color-mix(in srgb, var(--lc) 24%, transparent) 0); }
#view { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; outline: none; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1.5px solid var(--rule); background: var(--paper); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 9px; text-decoration: none; color: var(--ink-2); font: 600 0.8rem/1 var(--display); box-shadow: inset 0 3px 0 transparent; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--ink); }
.tab:focus-visible { outline-offset: -4px; }

/* ---------- shared bits ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--ink);
  background: var(--ink); color: var(--paper); font: 700 1.05rem/1.1 var(--display); text-decoration: none; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.quiet { background: transparent; color: var(--ink); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: var(--fs-1); border-radius: 10px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.link { background: none; border: 0; padding: 6px 0; font: 600 var(--fs-1)/1.2 var(--display); color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border: 1.5px solid var(--lc, var(--rule)); border-radius: 999px; font: 600 var(--fs-0)/1.3 var(--display); white-space: nowrap; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lc); }
.sci { font-style: italic; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px dashed var(--ink-2); border-radius: 12px; font-size: var(--fs-1); line-height: 1.4; color: var(--ink-2); }
.notice b { font-family: var(--display); color: var(--ink); }
.tells { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.tells li { position: relative; padding-left: 20px; line-height: 1.4; }
.tells li::before { content: ""; position: absolute; left: 0; top: 0.42em; width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--lc, var(--ink)); }

/* ---------- quiz ---------- */
.quiz { min-height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 4px var(--gutter) 14px; }
.quiz-top { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.deck-btn { flex: 1 1 88px; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--rule); border-radius: 10px;
  background: var(--raised); font: 700 var(--fs-1)/1.15 var(--display); text-align: left; }
.deck-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-btn svg { flex: none; width: 16px; height: 16px; }
.deck-btn:hover { border-color: var(--ink); }
.seg { flex: 0 1 auto; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--raised); }
.seg button { min-height: 33px; border: 0; border-radius: 7px; background: transparent; font: 700 var(--fs-1)/1 var(--display); color: var(--ink-2); padding: 0 10px; white-space: nowrap; }
.quiz-top .seg { grid-template-columns: auto auto; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.exam-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 700 var(--fs-1)/1.2 var(--display); min-height: 42px; }
.exam-top .count { font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 4px; align-items: center; min-height: 8px; }
.pips i { flex: 1; height: 6px; border-radius: 3px; background: var(--rule); }
.pips i.right { background: var(--good); }
.pips i.wrong { background: var(--bad); }
.pips i.now { background: var(--ink); }
.pips.long { gap: 0; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.pips.long i { flex: none; height: 100%; border-radius: 0; background: var(--ink); width: calc(var(--p) * 100%); }

.stage { position: relative; margin: 0; flex: 1 1 0; min-height: 210px; background: var(--stage); color: var(--stage-ink); border-radius: 14px; overflow: hidden; }
.stage .wash { position: absolute; inset: -12%; width: 124%; height: 124%; max-width: none; object-fit: cover; filter: blur(26px) brightness(0.42); }
.stage .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; animation: fadein 0.25s ease-out; }
.stage .zoom { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; cursor: zoom-in; }
.stage .zoom:focus-visible { outline: 3px solid #fff; outline-offset: -5px; border-radius: 14px; }
.pin { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px; background: rgba(6, 13, 10, 0.74); color: #fff;
  font: 600 var(--fs-0)/1.25 var(--display); pointer-events: none; }
.pin svg { flex: none; width: 14px; height: 14px; }
.stage.clues { flex: none; min-height: 0; overflow: visible; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 20px 22px; }
.stage.clues .kicker { font: 600 var(--fs-0)/1.3 var(--display); opacity: 0.75; }
.stage.clues .tells { gap: 10px; font-size: 1.14rem; }
.stage.clues .tells li::before { border-color: var(--stage-ink); opacity: 0.6; }
.stage.clues .range { font-size: var(--fs-1); opacity: 0.85; }

.panel { flex: none; display: grid; gap: 10px; align-content: start; }
.ask { font-size: var(--fs-3); font-weight: 800; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 8px 12px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--raised);
  font: 600 1.06rem/1.2 var(--display); text-align: left; }
@media (hover: hover) { .opt:hover { border-color: var(--ink); } }
.opt:active { transform: translateY(1px); }
.opt .key { flex: none; display: none; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--rule); place-items: center; font-size: var(--fs-0); color: var(--ink-2); }
.typed { display: flex; gap: 8px; }
.typed input { flex: 1; min-width: 0; height: 52px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--raised); font: 600 1.1rem var(--display); }
.typed input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 12px; }
.typed input::placeholder { color: var(--ink-2); font-weight: 500; opacity: 0.8; }
.typed .btn { min-height: 52px; }
.typed-msg { min-height: 1.4em; font-size: var(--fs-1); line-height: 1.4; }
.typed-msg.almost { color: var(--ink); }
.typed-msg b { font-family: var(--display); }
.under { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.streak { font: 600 var(--fs-0)/1 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; }

.reveal { display: grid; gap: 10px; }
.verdict { display: flex; align-items: center; gap: 8px; font: 700 var(--fs-2)/1.2 var(--display); }
.verdict .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--ink-2); }
.verdict .mark svg { width: 14px; height: 14px; }
.is-right .mark { background: var(--good); }
.is-wrong .mark { background: var(--bad); }
.verdict small { font: 500 var(--fs-0)/1.2 var(--display); color: var(--ink-2); }
.cat-head { display: grid; gap: 4px; }
.cat-name { font-size: var(--fs-4); font-weight: 800; }
.cat-sub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); }
.mixup { padding: 9px 12px; border-left: 4px solid var(--bad); border-radius: 0 10px 10px 0; background: color-mix(in oklab, var(--bad) 9%, var(--paper)); font-size: var(--fs-1); line-height: 1.45; }
.mixup b { font-family: var(--display); }
.mixup.with-thumb { display: grid; grid-template-columns: 1fr 64px; gap: 12px; align-items: start; }
.mixup img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--rule); }
.filled { display: flex; align-items: center; gap: 8px; font: 700 var(--fs-1)/1.2 var(--display); }
.filled .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--lc); animation: pop 0.5s ease-out; }
.credit { font-size: var(--fs-0); color: var(--ink-2); line-height: 1.35; overflow-wrap: anywhere; }
.reveal-actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; position: sticky; bottom: 0; padding: 10px 0 2px; background: var(--paper); box-shadow: 0 -12px 12px -8px var(--paper); }
.reveal-actions .btn { flex: 1 1 180px; }

/* ---------- round and exam summaries ---------- */
.page { padding: 8px var(--gutter) 28px; display: grid; gap: 18px; align-content: start; max-width: 760px; }
.page h1 { font-size: var(--fs-5); font-weight: 800; letter-spacing: -0.025em; }
.page h2 { font-size: var(--fs-3); font-weight: 800; }
.page .lede { font-size: 1.15rem; line-height: 1.45; max-width: 60ch; }
.page p { max-width: 65ch; }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score b { font: 800 4rem/0.9 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.score span { font: 600 var(--fs-2)/1.2 var(--display); color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.misses { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.misses li { display: grid; gap: 3px; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--raised); }
.misses .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.misses .who a { font: 700 1.1rem/1.2 var(--display); }
.misses .who span { font: 500 var(--fs-0)/1.2 var(--display); color: var(--ink-2); }
.misses p { font-size: var(--fs-1); line-height: 1.45; }
.cert { display: grid; gap: 8px; padding: 16px; border: 2.5px solid var(--ink); border-radius: 14px; }
.cert h2 { font-size: var(--fs-4); }
.cert textarea { width: 100%; min-height: 5.2em; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--raised); color: inherit; font: 400 var(--fs-1)/1.4 var(--text); padding: 8px 10px; resize: none; }
.bests { display: grid; gap: 4px; font: 600 var(--fs-1)/1.4 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- the line map ---------- */
.lines { padding: 8px 0 28px; }
.lines-head { padding: 0 var(--gutter) 16px; display: grid; gap: 12px; }
.lines-head h1 { font-size: var(--fs-5); font-weight: 800; letter-spacing: -0.025em; }
.lines-head .lede { max-width: 58ch; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 600 var(--fs-1)/1.3 var(--display); }
.tally span { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.tally .dot, .stop .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--lc, var(--ink)); background: var(--paper); }
.tally .dot { width: 16px; height: 16px; border-width: 3px; }
.dot[data-stage="learning"], .stop[data-stage="learning"] .dot { background: radial-gradient(circle, var(--lc, var(--ink)) 0 27%, var(--paper) 31%); }
.dot[data-stage="cold"], .stop[data-stage="cold"] .dot { background: var(--lc, var(--ink)); }
.line { padding: 16px 0 8px; border-top: 1.5px solid var(--rule); break-inside: avoid; }
.line-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 0 var(--gutter); }
.line-head h2 { font-size: var(--fs-3); font-weight: 800; display: flex; align-items: center; gap: 10px; }
.line-head h2::before { content: ""; width: 22px; height: 6px; border-radius: 3px; background: var(--lc); }
.line-head p { grid-column: 1 / -1; color: var(--ink-2); font-size: var(--fs-1); line-height: 1.4; max-width: 58ch; }
.stops { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
.stops::before { content: ""; position: absolute; left: calc(var(--gutter) + 9px); top: 24px; bottom: 24px; width: 4px; border-radius: 2px; background: var(--lc); }
.stop { position: relative; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 14px; padding: 7px var(--gutter); min-height: 50px; text-decoration: none; }
@media (hover: hover) { .stop:hover { background: color-mix(in srgb, var(--lc) 9%, transparent); } }
.stop:focus-visible { outline-offset: -3px; }
.stop .dot { position: relative; z-index: 1; }
.stop-name { display: block; font: 700 1.1rem/1.15 var(--display); }
.stop-sci { display: block; font: italic 400 var(--fs-0)/1.25 var(--text); color: var(--ink-2); }
.stop-side { display: flex; align-items: center; gap: 10px; font: 600 var(--fs-0)/1 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stop-side img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--rule); }

/* ---------- one cat ---------- */
.cat { padding: 4px 0 28px; display: grid; gap: 18px; }
.cat > * { padding-left: var(--gutter); padding-right: var(--gutter); }
.back { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font: 700 var(--fs-1)/1 var(--display); text-decoration: none; padding-top: 8px; padding-bottom: 8px; }
.back svg { width: 16px; height: 16px; }
.cat-title { display: grid; gap: 6px; }
.cat-title h1 { font-size: var(--fs-5); font-weight: 800; letter-spacing: -0.025em; }
.cat-title .sci { font-size: 1.2rem; }
.cat-title .also { color: var(--ink-2); font-size: var(--fs-1); }
.gallery { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); padding-bottom: 6px; scrollbar-width: thin; }
.gallery figure { flex: none; margin: 0; width: min(86%, 520px); scroll-snap-align: start; display: grid; gap: 5px; }
.gallery img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; background: var(--stage); display: block; }
.gallery figcaption { font-size: var(--fs-0); color: var(--ink-2); line-height: 1.35; overflow-wrap: anywhere; }
.gallery .tag { font-family: var(--display); font-weight: 700; color: var(--ink); }
.nophoto { display: grid; place-items: center; min-height: 130px; border-radius: 14px; background: var(--stage); color: var(--stage-ink); text-align: center; padding: 18px var(--gutter); font: 600 var(--fs-1)/1.4 var(--display); margin: 0 var(--gutter); }
.cat section { display: grid; gap: 10px; }
.cat section h2 { font-size: var(--fs-3); font-weight: 800; }
.cat section > p, .cat .tells { max-width: 62ch; }
.versus { display: grid; gap: 10px; }
.versus div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-left: 12px; border-left: 4px solid var(--vc, var(--rule)); max-width: 62ch; }
.versus img { grid-column: 2; grid-row: 1 / span 2; width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--rule); }
.versus p { grid-column: 1; }
.versus a { font: 700 1.08rem/1.2 var(--display); justify-self: start; }
.versus p { font-size: var(--fs-1); line-height: 1.45; }
.facts { margin: 0; display: grid; gap: 0; border-top: 1.5px solid var(--rule); max-width: 760px; }
.facts div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1.5px solid var(--rule); }
.facts dt { font: 700 var(--fs-1)/1.4 var(--display); color: var(--ink-2); }
.facts dd { margin: 0; line-height: 1.4; }
.pager { display: flex; justify-content: space-between; gap: 12px; }
.pager a { font: 700 var(--fs-1)/1.2 var(--display); }

/* ---------- notes ---------- */
.table-wrap { overflow-x: auto; }
table.names { border-collapse: collapse; width: 100%; min-width: 300px; font-size: var(--fs-1); line-height: 1.4; }
.names th { text-align: left; font: 700 var(--fs-0)/1.3 var(--display); color: var(--ink-2); padding: 0 12px 6px 0; border-bottom: 1.5px solid var(--ink); }
.names td { padding: 8px 12px 8px 0; border-bottom: 1.5px solid var(--rule); vertical-align: top; }
.names td:first-child { width: 56%; }
.names td:last-child { font-family: var(--display); font-weight: 700; }
.page ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 65ch; }
.settings { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.row > span { font: 600 var(--fs-2)/1.3 var(--display); }
.row .seg { flex: 0 1 260px; }
.row .seg.three { grid-template-columns: 1fr 1fr 1fr; }
.credits { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--fs-0); line-height: 1.4; overflow-wrap: anywhere; }
.credits b { font-family: var(--display); }
.sources { font-size: var(--fs-1); }
.sources li { overflow-wrap: anywhere; }

/* ---------- sheet and zoom ---------- */
.scrim { position: fixed; inset: 0; background: rgba(6, 13, 10, 0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { width: min(100%, 560px); max-height: 86%; display: flex; flex-direction: column; background: var(--paper); border-radius: 18px 18px 0 0; overflow: hidden; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px var(--gutter) 10px; border-bottom: 1.5px solid var(--rule); }
.sheet-head h2 { font-size: var(--fs-3); font-weight: 800; }
.sheet-body { overflow-y: auto; padding: 6px 0 18px; }
.sheet h3 { font: 700 var(--fs-0)/1.2 var(--display); color: var(--ink-2); padding: 14px var(--gutter) 4px; }
.deck { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; width: 100%; padding: 10px var(--gutter); border: 0; background: transparent; text-align: left; }
@media (hover: hover) { .deck:hover { background: var(--raised); } }
.deck b { font: 700 1.05rem/1.2 var(--display); }
.deck span { font: 500 var(--fs-0)/1.2 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.deck[aria-current="true"] b::after { content: " \2713"; }
.sheet .settings { padding: 8px var(--gutter) 0; }
.zoomer { position: fixed; inset: 0; z-index: 30; background: #050a08; overflow: auto; cursor: zoom-out; }
.zoomer img { display: block; width: 100%; height: 100%; object-fit: contain; max-width: none; }
.zoomer.in img { width: 260%; height: auto; object-fit: initial; }
.zoomer .close { position: fixed; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.16); color: #fff; font: 700 1.3rem/1 var(--display); }
.zoomer .tip { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.14); color: #fff; font: 600 var(--fs-0)/1.2 var(--display); white-space: nowrap; pointer-events: none; }

@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.4); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- phones ---------- */
@media (max-width: 899px) {
  .quiz[data-kind="clue"][data-answered="1"] .stage { display: none; } /* the answer repeats the field marks */
  .quiz[data-mode="type"] .stage:not(.clues) { flex: 0 0 auto; height: min(40vh, 320px); } /* keeps the box you type in above the keyboard */
  .row .seg { flex: 1 1 100%; }
}

/* ---------- wider screens ---------- */
@media (max-width: 339px) { .options { grid-template-columns: 1fr; } }
@media (min-width: 560px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 18px; }
}
@media (hover: hover) and (min-width: 700px) { .opt .key { display: grid; } }
@media (min-width: 900px) {
  :root { --gutter: 24px; }
  #app { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; }
  .bar { grid-column: 1; }
  .tabs { grid-column: 2; grid-row: 1; border-top: 0; display: flex; gap: 4px; align-items: center; padding-right: var(--gutter); }
  .tab { flex-direction: row; gap: 8px; padding: 9px 14px; border-radius: 10px; font-size: var(--fs-1); box-shadow: none; }
  .tab svg { width: 20px; height: 20px; }
  .tab[aria-current="page"] { background: var(--ink); color: var(--paper); box-shadow: none; }
  .known { margin-left: 16px; }
  #view { grid-column: 1 / -1; }
  .quiz { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); grid-template-rows: auto auto 1fr; gap: 12px 24px; padding-top: 8px; padding-bottom: 24px; }
  .quiz-top, .exam-top, .quiz > .notice { grid-column: 1 / -1; }
  .pips { grid-column: 1 / -1; }
  .stage { grid-column: 1; grid-row: 3; min-height: 420px; }
  .stage.clues { align-self: start; padding: 32px 36px; }
  .stage.clues .tells { font-size: 1.3rem; gap: 14px; }
  .seg { flex: 1 1 200px; }
  .panel { grid-column: 2; grid-row: 3; align-content: start; }
  .options { grid-template-columns: 1fr; }
  .opt { min-height: 52px; padding: 9px 14px; }
  .quiz-top .seg { grid-template-columns: 1fr 1fr; }
  .lines-body { columns: 2; column-gap: 40px; padding: 0 calc(var(--gutter) - 16px); }
  .lines-body .line { --gutter: 16px; }
  .cat { max-width: 900px; }
  .gallery figure { width: 440px; }
}

</style>
</head>

<script>
/* Every Cat in the World: interface. */
(function () {
  'use strict';
  const D = window.CATDATA, E = window.CATENGINE;

  };

  const HAS_PHOTOS = D.CATS.some((c) => photosOf(c.id).length > 0);
  const ALL_PHOTOS = D.CATS.every((c) => photosOf(c.id).some((p) => !p.cb));
  const HAS_CURVE = D.CATS.some((c) => photosOf(c.id).some((p) => p.cb));

  // ---------- saved progress ----------
  function freshState() {

  }

    const cats = {};

  const labelOf = (cat) => cat.label || cat.name;

  // ---------- decks ----------
  function allDecks() {

    if (seen >= 6) { const ids = E.weakDeck(S.cats, 12); if (ids.length >= 4) list.unshift({ id: 'weak', group: 'Yours', name: 'Your weak spots', ids }); }

      el.className = 'pips';
      let h = '';
      for (let i = 0; i < Q.length; i++) h += '<i class="' + (i < done ? (Q.results[i].right ? 'right' : 'wrong') : i === done ? 'now' : '') + '"></i>';
      el.innerHTML = h;
    } else {
      el.className = 'pips long';
      el.innerHTML = '<i style="--p:' + (done / Q.length).toFixed(4) + '"></i>';
    }
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', 'Question ' + Math.min(done + 1, Q.length) + ' of ' + Q.length + '. ' + Q.results.filter((r) => r.right).length + ' right so far.');
  }
  function paintStage(Q) {
    const el = $('#q-stage'); if (!el || !Q.cur) return;
    const q = Q.cur, cat = E.byId[q.id];
    if (q.kind === 'photo') {
      const p = photosOf(q.id)[q.pi];
      const where = cat.hint ? (p.loc || cat.hint) : '';
      el.className = 'stage';
      el.innerHTML = '<img class="wash" src="' + esc(p.f) + '" alt="" aria-hidden="true">' +
        '<img class="shot" src="' + esc(p.f) + '" alt="Photo of a cat to identify" data-photo="' + esc(p.f) + '" data-cat="' + q.id + '">' +
        '<button class="zoom" type="button" data-action="zoom" aria-label="Enlarge the photo"></button>' +
        (where ? '<span class="pin">' + ICON.pin + '<span>' + (p.loc ? 'Photographed in: ' : 'Range: ') + esc(where) + '</span></span>' : '');
    } else {
      el.className = 'stage clues';
      el.innerHTML = '<p class="kicker">' + (HAS_PHOTOS ? 'No photo of this cat yet. Its field marks:' : 'Photos are not loaded yet, so here are this cat\u2019s field marks:') + '</p>' +
        '<ul class="tells">' + cat.tells.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
        '<p class="range">Lives: ' + esc(cat.where) + '</p>';
    }
  }
  function formHTML(Q) {
    return '<form class="typed" id="typed-form" autocomplete="off" novalidate><label class="sr" for="answer">Name this cat</label>' +
      '<input id="answer" name="answer" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="Type the cat’s name">' +
      '<button class="btn" type="submit" id="typed-go">Check</button></form>';
  }
  function creditHTML(p) {
    if (!p) return '';
    const who = [p.by, p.lic].filter(Boolean).join(', ');
    const link = p.src ? ' <a href="' + esc(p.src) + '" target="_blank" rel="noopener">Source</a>' : '';
    return '<p class="credit">' + (p.note ? '<b>' + esc(p.note) + '</b> ' : '') + 'Photo: ' + esc(who || 'credit pending') + '.' + link + '</p>';
  }
  function revealHTML(Q) {
    const q = Q.cur, cat = E.byId[q.id], res = q.result, right = res.verdict === 'right';
    const line = E.lineById[cat.line];
    const cls = right ? 'is-right' : res.verdict === 'skip' ? 'is-skip' : 'is-wrong';
    const word = right ? 'Correct' : res.verdict === 'skip' ? 'Here it is' : 'Not this time';
    const mark = right ? ICON.check : res.verdict === 'skip' ? ICON.arrow : ICON.cross;
    let mix = '';
    if (!right && res.said && E.byId[res.said]) {
      const other = E.byId[res.said], tip = E.tellApart(q.id, res.said);
      const th = thumbOf(other.id);
      mix = '<div class="mixup' + (th ? ' with-thumb' : '') + '"><span><b>You said ' + esc(other.name) + '.</b> ' + esc(tip || ('For comparison, the ' + lower(other.name) + ': ' + lowerFirst(other.tells[0]) + '.')) + '</span>' +
        (th ? '<a href="#cat-' + other.id + '"><img src="' + esc(th) + '" alt="' + esc(other.name) + '"></a>' : '') + '</div>';
    } else if (!right && res.verdict === 'wrong' && res.text) {
      mix = '<div class="mixup"><b>You said “' + esc(res.text) + '”.</b></div>';
    }
    const also = cat.also && cat.also.length ? '<span>Also: ' + esc(cat.also.join(', ')) + '</span>' : '';
    const filled = q.becameCold ? '<p class="filled ' + lineClass(cat) + '"><span class="dot"></span>Station filled. ' + coldCount() + ' of 41 known cold.</p>' : '';
    const next = Q.i + 1 >= Q.length ? (Q.kind === 'exam' ? 'See the result' : 'Finish the round') : 'Next cat';
    return '<div class="reveal ' + cls + ' ' + lineClass(cat) + '">' +
      '<p class="verdict"><span class="mark">' + mark + '</span><span>' + word + '</span>' + (right && res.typo ? '<small>spelling forgiven</small>' : '') + '</p>' +
      '<div class="cat-head"><h3 class="cat-name">' + esc(cat.name) + '</h3>' +
      '<p class="cat-sub"><span class="sci">' + esc(cat.sci) + '</span><span class="chip"><i class="dot"></i>' + esc(line.name) + '</span>' + also + '</p></div>' +
      mix + filled +
      '<ul class="tells">' + cat.tells.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
      (q.kind === 'photo' ? creditHTML(photosOf(q.id)[q.pi]) : '') +
      '<div class="reveal-actions"><a class="link" href="#cat-' + cat.id + '">More on this cat</a>' +
      (Q.mode === 'mc' ? '<button class="btn" type="button" data-action="next" id="next-btn">' + next + '</button>' : '') + '</div></div>';
  }
  const lower = (name) => (/^(Asian|African|Andean|Eurasian|Iberian|Canada|Sunda|Geoffroy|Pallas|Chinese|European|Pampas)/.test(name) ? name : name.charAt(0).toLowerCase() + name.slice(1));
  const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);

  function paintPanel(Q, wantFocus) {
    const head = $('#p-head'), ans = $('#p-answer'), foot = $('#p-foot'), rev = $('#p-reveal');
    if (!head || !Q.cur) return;
    const q = Q.cur, typed = Q.mode === 'type', quiz = $('#quiz');
    quiz.dataset.mode = Q.mode; quiz.dataset.kind = q.kind; quiz.dataset.answered = q.answered ? '1' : '0';
    head.innerHTML = q.answered ? '' : '<h2 class="ask" id="ask">Which cat is this?</h2>';
    const streak = Q.streak >= 3 ? '<span class="streak">' + Q.streak + ' right in a row</span>' : '<span></span>';
    if (typed) {
      let form = $('#typed-form');
      if (!form) { ans.innerHTML = formHTML(Q); form = $('#typed-form'); }
      const input = $('#answer'), go = $('#typed-go');
      const last = Q.i + 1 >= Q.length;
      go.textContent = q.answered ? (last ? (Q.kind === 'exam' ? 'See the result' : 'Finish') : 'Next cat') : 'Check';
      input.setAttribute('enterkeyhint', q.answered ? 'next' : 'go');
      if (!q.answered && !q.msg) input.value = q.typed || '';
      if (wantFocus && document.activeElement !== input) { try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } }
      if (wantFocus && !q.answered) keepPhotoInView();
    } else {
      ans.innerHTML = q.answered ? '' : '<div class="options" role="group" aria-labelledby="ask">' + q.options.map((id, i) =>
        '<button class="opt" type="button" data-action="pick" data-id="' + id + '"><span class="key" aria-hidden="true">' + (i + 1) + '</span><span>' + esc(labelOf(E.byId[id])) + '</span></button>').join('') + '</div>';
    }
    if (q.answered) foot.innerHTML = '';
    else {
      let msg = '';
      if (typed) {
        if (q.msg && q.msg.verdict === 'almost') msg = '<p class="typed-msg almost" role="status"><b>Close.</b> ' + esc(q.msg.ask) + '</p>';
        else if (q.msg && q.msg.verdict === 'unknown') msg = '<p class="typed-msg" role="status"><b>I don’t know that name.</b> Check the spelling, or show the answer.</p>';
        else msg = '<p class="typed-msg" role="status"></p>';
      }
      foot.innerHTML = msg + '<div class="under"><button class="link" type="button" data-action="skip">' + (typed ? 'Show the answer' : 'I don’t know') + '</button>' + streak + '</div>';
    }
    rev.innerHTML = q.answered ? revealHTML(Q) : '';
    if (q.answered && !typed && wantFocus) { const b = $('#next-btn'); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } } }
  }
  // on a phone the keyboard covers the lower half, so slide the controls away and keep photo and input on screen
  function keepPhotoInView() {
    const st = $('#q-stage');

  }
  function paintQuiz(Q, wantFocus) { mountQuiz(); paintTop(Q); paintPips(Q); paintStage(Q); paintPanel(Q, wantFocus); }

  // ---------- views ----------
  function missesHTML(Q) {
    const seen = new Set();
    const rows = Q.results.filter((r) => !r.right && !seen.has(r.id) && seen.add(r.id)).map((r) => {
      const cat = E.byId[r.id], other = r.said && E.byId[r.said];
      const tip = other ? E.tellApart(r.id, r.said) : null;
      return '<li class="' + lineClass(cat) + '"><div class="who"><a href="#cat-' + cat.id + '">' + esc(cat.name) + '</a>' +
        '<span>' + (other ? 'you said ' + esc(other.name) : r.skip ? 'skipped' : r.text ? 'you said “' + esc(r.text) + '”' : '') + '</span></div>' +
        '<p>' + esc(tip || cat.tells[0] + '.') + '</p></li>';
    });
    return rows.length ? '<ul class="misses">' + rows.join('') + '</ul>' : '';
  }
  const fmtTime = (ms) => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; };
  const fmtDate = (t) => { try { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };

  function renderTrain() {
    let Q = sessions.train;
    if (!Q) Q = startRound('train');
    if (!Q.done) { paintQuiz(Q, false); return; }
    const right = Q.results.filter((r) => r.right).length;
    const missed = [...new Set(Q.results.filter((r) => !r.right).map((r) => r.id))];
    let nudge = '';
    const order = ['tier1', 'tier2', 'tier3', 'all'];
    const at = order.indexOf(S.settings.deck);
    if (!Q.custom && at >= 0 && at < 3) {
      const deck = getDeck(S.settings.deck), cold = coldCount(deck.ids);
      if (right === Q.length || cold >= deck.ids.length * 0.75) {
        const nextDeck = getDeck(order[at + 1]);
        nudge = '<div class="notice"><span><b>Ready for more.</b> ' + (HAS_PHOTOS ? cold + ' of ' + deck.ids.length + ' in this deck are known cold. ' : '') + 'Move on to “' + esc(nextDeck.name) + '”.</span></div>' +
          '<div class="actions"><button class="btn" type="button" data-action="pick-deck" data-deck="' + nextDeck.id + '">Start ' + esc(nextDeck.name.split(':')[0].toLowerCase() === 'all 41 cats' ? 'all 41' : 'the next deck') + '</button></div>';
      }
    }
    view.innerHTML = '<section class="page"><h1>Round done</h1>' +
      '<p class="score"><b>' + right + '/' + Q.length + '</b><span>' + esc(Q.name) + ', ' + (Q.mode === 'type' ? 'typed' : 'multiple choice') + '</span></p>' +
      (missed.length ? '<h2>What to look at again</h2>' + missesHTML(Q) : '<p class="lede">A clean round. ' + coldCount() + ' of 41 cats are known cold.</p>') +
      nudge +
      '<div class="actions"><button class="btn' + (nudge ? ' quiet' : '') + '" type="button" data-action="again">Go again</button>' +
      (missed.length >= 2 ? '<button class="btn quiet" type="button" data-action="drill-misses">Drill these ' + missed.length + '</button>' : '') +
      '<button class="btn quiet" type="button" data-action="open-decks">Choose another deck</button></div></section>';
  }

  function bestsHTML() {
    const line = (label, b) => (b ? '<span>' + label + ': ' + b.score + ' of ' + b.of + ' in ' + fmtTime(b.ms) + ', ' + fmtDate(b.at) + (b.photos < b.of ? ' (written clues)' : '') + '</span>' : '');
    const h = line('Best typed', S.exam.type) + line('Best multiple choice', S.exam.mc);

  function renderExam() {
    const Q = sessions.exam;
    if (Q && !Q.done) { paintQuiz(Q, false); return; }
    if (Q && Q.done) {
      const right = Q.results.filter((r) => r.right).length, perfect = right === Q.length;
      const withPhotos = Q.photoCount === Q.length;
      let top = '';
      if (perfect && Q.mode === 'type' && withPhotos) {
        const brag = 'I just named all 41 living cat species from photos, typed from memory. Pick any cat and try me.';
        top = '<div class="cert"><h2>You can identify every cat in the world.</h2><p>All 41 species, named from photos and typed from memory, on ' + fmtDate(Q.endedAt) + '. The IUCN list is your referee.</p>' +
          '<textarea id="brag" readonly rows="3" aria-label="A line to send your friends">' + esc(brag) + '</textarea><div class="actions"><button class="btn small" type="button" data-action="copy-brag">Copy that line</button><span class="streak" id="copied" role="status"></span></div></div>';
      } else if (perfect) {

      (S.exam.certified ? '<div class="cert"><h2>You can identify every cat in the world.</h2><p>Passed typed, from photos, on ' + fmtDate(S.exam.certified) + '.</p></div>' : '') +

  function renderCats() {

    let h = '<section class="lines"><div class="lines-head"><h1>All 41 cats, on eight lines</h1>' +

      '<p class="tally"><span><i class="dot" data-stage="cold"></i>' + counts.cold + ' known cold</span><span><i class="dot" data-stage="learning"></i>' + counts.learning + ' learning</span><span><i class="dot"></i>' + counts.new + ' not seen yet</span></p></div><div class="lines-body">';
    for (const l of D.LINES) {

  function renderCat(id) {
    const c = E.byId[id], l = E.lineById[c.line], idx = E.ALL_IDS.indexOf(id);
    const mates = D.CATS.filter((x) => x.line === c.line), pos = mates.indexOf(c) + 1;
    const r = S.cats[id], st = stageOf(id), sz = E.sizeText(c), ph = usable(id);

      '<div><dt>Red List</dt><dd>' + D.STATUS[c.status] + '</dd></div>' +
      '<div><dt>Your record</dt><dd>' + STAGE_WORD[st] + (r && r.seen ? '. Right ' + r.right + ' of ' + r.seen + ' times.' : '.') + (conf ? ' Mixed up with: ' + conf + '.' : '') + '</dd></div></dl></section>' +

  }

  function renderNotes() {
    let credits = '';
    if (HAS_PHOTOS) {
      credits = '<h2>Photo credits</h2><p>Every photo is freely licensed. Thank you to the photographers.</p><ul class="credits">' + D.CATS.map((c) => {
        const list = photosOf(c.id); if (!list.length) return '';
        return '<li><b>' + esc(c.name) + ':</b> ' + list.map((p) => (p.src ? '<a href="' + esc(p.src) + '" target="_blank" rel="noopener">' + esc(p.by || 'photo') + '</a>' : esc(p.by || 'photo')) + (p.lic ? ' (' + esc(p.lic) + ')' : '')).join('; ') + '</li>';
      }).join('') + '</ul>';
    } else {
      credits = '<h2>Photos</h2><div class="notice"><span><b>Photos are not loaded in this build yet.</b> Each cat gets several freely licensed photos with credits listed here. Until then the rounds use written field marks.</span></div>';
    }
    view.innerHTML = '<section class="page">' +
      '<h1>What counts as a cat</h1>' +
      '<p class="lede">The count is 41. The IUCN Cat Specialist Group revised the cat family in 2017 and recognised 41 living species: 40 wild cats plus the domestic cat. This trainer uses that list, and it is the one to cite when someone argues.</p>' +
      '<h2>Names people will throw at you</h2><p>Most of them are a regional form, a colour form or a nickname of one of the 41.</p>' +
      '<div class="table-wrap"><table class="names"><thead><tr><th scope="col">People say</th><th scope="col">It is</th></tr></thead><tbody>' + NAMES.map((n) => '<tr><td>' + esc(n[0]) + '</td><td>' + esc(n[1]) + '</td></tr>').join('') + '</tbody></table></div>' +
      '<h2>Four pairs you cannot split by looks</h2><p>Even specialists need to know where these were photographed. The trainer shows the location for them, and you can fairly ask for it.</p>' +
      '<ul class="plain"><li>Northern tiger cat and southern tiger cat</li><li>Leopard cat and Sunda leopard cat</li><li>Clouded leopard and Sunda clouded leopard, whose coats differ only slightly</li><li>African wildcat, European wildcat and a tabby house cat</li></ul>' +
      '<h2>Newer splits you can concede</h2><p>Taxonomy moves. These proposals are not on the IUCN list yet. If one is adopted, the count goes up and so does your claim.</p>' +
      '<ul class="plain"><li><b>Tiger cats.</b> The IUCN list has two. A 2024 study raised a third to species level, the clouded tiger cat (<span class="sci">Leopardus pardinoides</span>). In September 2026 a genome study in Current Biology argued for five and named a new one from Bolivia, the tilcayo (<span class="sci">Leopardus tilcayo</span>).</li>' +
      '<li><b>Pampas cat.</b> Some checklists split it into several species, such as a separate Pantanal cat. The Cat Specialist Group keeps it as one.</li></ul>' +
      '<h2>Settings</h2>' + settingsHTML() +
      '<div class="row"><span>Saved progress on this device</span><span id="reset-zone"><button class="btn small quiet" type="button" data-action="reset-ask">Reset my progress</button></span></div>' +
      credits +
      '<h2>Sources</h2><ul class="plain sources">' + SOURCES.map((s) => '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>').join('') + '</ul>' +
      '</section>';
  }

  // ---------- deck sheet and zoom ----------
  function openDecks() {
    closeLayer();
    const groups = {};
    for (const d of allDecks()) (groups[d.group] = groups[d.group] || []).push(d);
    let body = '';
    for (const g of Object.keys(groups)) {
      body += '<h3>' + esc(g) + '</h3>' + groups[g].map((d) => '<button class="deck" type="button" data-action="pick-deck" data-deck="' + d.id + '"' + (d.id === S.settings.deck ? ' aria-current="true"' : '') + '><b>' + esc(d.name) + '</b>' +
        '<span>' + coldCount(d.ids) + ' of ' + d.ids.length + ' cold</span></button>').join('');
    }
    const el = document.createElement('div');
    el.className = 'scrim'; el.id = 'layer'; el.dataset.action = 'close-layer';
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">Choose a deck</h2><button class="btn small quiet" type="button" data-action="close-layer">Done</button></div>' +
      '<div class="sheet-body">' + body + '<h3>Round options</h3>' + settingsHTML() + '</div></div>';
    document.body.appendChild(el);
    const cur = el.querySelector('.deck[aria-current]') || el.querySelector('.deck');
    if (cur) cur.focus();
  }
  function openZoom(src) {
    closeLayer();
    const el = document.createElement('div');
    el.className = 'zoomer'; el.id = 'layer'; el.dataset.action = 'zoom-toggle';
    el.innerHTML = '<img src="' + esc(src) + '" alt="The same photo, enlarged"><button class="close" type="button" data-action="close-layer" aria-label="Close the enlarged photo">×</button><span class="tip">Tap to zoom in, then drag to look around</span>';
    document.body.appendChild(el);
    el.querySelector('.close').focus();
  }
  function closeLayer() { const l = $('#layer'); if (l) l.remove(); }

  // ---------- render ----------
  function render() {
    const r = route();
    closeLayer();
    paintChrome();
    if (r.name === 'train') renderTrain();
    else if (r.name === 'exam') renderExam();
    else if (r.name === 'cats') renderCats();
    else if (r.name === 'cat') renderCat(r.id);
    else renderNotes();
    document.title = 'Every Cat in the World';
  }
  const activeQuiz = () => { const r = route(); const Q = r.name === 'train' ? sessions.train : r.name === 'exam' ? sessions.exam : null; return Q && !Q.done && Q.cur ? Q : null; };

  // ---------- events ----------
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action, Q = activeQuiz();
    if (a === 'close-layer') { if (ev.target === el || el.tagName === 'BUTTON') closeLayer(); return; }
    if (a === 'zoom-toggle') { if (!ev.target.closest('button')) el.classList.toggle('in'); return; }
    if (a === 'pick' && Q) submit(Q, { id: el.dataset.id });
    else if (a === 'skip' && Q) submit(Q, { skip: true });
    else if (a === 'next' && Q) advance(Q);
    else if (a === 'zoom') { const img = $('#q-stage .shot'); if (img) openZoom(img.getAttribute('src')); }
    else if (a === 'open-decks') openDecks();
    else if (a === 'set-mode') {
      S.settings.mode = el.dataset.mode; save();
      if (sessions.train) { sessions.train.mode = S.settings.mode; if (Q && Q.kind === 'train') { $('#p-answer').innerHTML = ''; paintTop(Q); paintPanel(Q, true); } }
    } else if (a === 'pick-deck') {
      S.settings.deck = el.dataset.deck; closeLayer(); startRound('train', { deckId: el.dataset.deck });
      if (route().name !== 'train') location.hash = '#train'; else render();
    } else if (a === 'set') {
      const k = el.dataset.key, raw = el.dataset.value;
      S.settings[k] = raw === 'true' ? true : raw === 'false' ? false : raw === 'deck' ? 'deck' : Number(raw);
      save();
      el.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b === el)));
      if (k === 'round' && sessions.train && !sessions.train.results.length) { startRound('train', { deckId: S.settings.deck }); if (route().name === 'train' && !$('#layer')) render(); }
    } else if (a === 'again') { startRound('train', sessions.train && sessions.train.custom ? { ids: sessions.train.ids, name: sessions.train.name } : { deckId: S.settings.deck }); render(); }
    else if (a === 'drill-misses') {
      const from = el.dataset.from === 'exam' ? sessions.exam : sessions.train;
      const ids = [...new Set(from.results.filter((r) => !r.right).map((r) => r.id))];
      startRound('train', { ids, name: 'Your misses', whole: ids.length > 10 });
      if (route().name !== 'train') location.hash = '#train'; else render();
    } else if (a === 'start-exam') { startRound('exam', { mode: el.dataset.mode }); render(); const i = $('#answer'); if (i) i.focus(); }
    else if (a === 'quit-exam' || a === 'exam-home') { sessions.exam = null; render(); }
    else if (a === 'copy-brag') {
      const t = $('#brag'), note = $('#copied');
      const done = () => { if (note) note.textContent = 'Copied'; };
      const manual = () => { t.focus(); t.select(); if (note) note.textContent = 'Selected. Copy it from here.'; };
      try { navigator.clipboard.writeText(t.value).then(done, manual); } catch (e) { manual(); }
    } else if (a === 'reset-ask') {
      $('#reset-zone').innerHTML = '<span class="actions"><button class="btn small" type="button" data-action="reset-yes">Yes, wipe it</button><button class="btn small quiet" type="button" data-action="reset-no">Keep it</button></span>';
    } else if (a === 'reset-no') render();
    else if (a === 'reset-yes') { const keep = S.settings; S = freshState(); S.settings = keep; sessions.train = null; sessions.exam = null; save(); render(); }
  });
  document.addEventListener('submit', (ev) => {
    if (ev.target.id !== 'typed-form') return;
    ev.preventDefault();
    const Q = activeQuiz(); if (!Q) return;
    const input = $('#answer');
    if (Q.cur.answered) { input.value = ''; advance(Q); return; }
    Q.cur.typed = input.value;
    submit(Q, { text: input.value });
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && $('#layer')) { closeLayer(); return; }
    if ($('#layer') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const Q = activeQuiz(); if (!Q) return;
    const tag = ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (!Q.cur.answered && Q.mode === 'mc' && ev.key >= '1' && ev.key <= '4') { const id = Q.cur.options[Number(ev.key) - 1]; if (id) { ev.preventDefault(); submit(Q, { id }); } }
    else if (Q.cur.answered && (ev.key === 'Enter' || ev.key === 'ArrowRight') && tag !== 'BUTTON' && tag !== 'A') { ev.preventDefault(); advance(Q); }
  });
  // a photo that fails to load is dropped for this visit and the question falls back to another photo or to clues
  document.addEventListener('error', (ev) => {
    const t = ev.target;
    if (!t || !t.dataset || !t.dataset.photo) return;
    const id = t.dataset.cat, p = photosOf(id).find((x) => x.f === t.dataset.photo);
    if (p) p.bad = true;
    const Q = activeQuiz();
    if (Q && Q.cur.id === id && !Q.cur.answered) {
      const pi = E.pickPhoto(photosOf(id), S.cats[id], rng, Q.kind !== 'exam' && S.settings.curve);
      Q.cur.pi = pi; Q.cur.kind = pi >= 0 ? 'photo' : 'clue';
      paintStage(Q);
    }
  }, true);
  document.addEventListener('focusin', (ev) => { if (ev.target && ev.target.id === 'answer') setTimeout(keepPhotoInView, 250); });
  window.addEventListener('hashchange', () => { render(); view.scrollTop = 0; view.focus({ preventScroll: true }); });

  // ---------- boot ----------
  function start(data) {
    if (data && data.sessions) { for (const k of ['train', 'exam']) { const q = data.sessions[k]; if (q && Array.isArray(q.ids) && q.ids.every((id) => E.byId[id])) sessions[k] = q; } }
    render();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ sessions: JSON.parse(JSON.stringify(sessions)) }));
  if (window.__TEST__) window.__everycat = { sessions, state: () => S };
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
